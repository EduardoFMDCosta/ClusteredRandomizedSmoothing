[build-system]
requires = ["uv_build>=0.11.4,<0.12"]
build-backend = "uv_build"

[project]
name = "randomized-smoothing"
version = "0.1.0"
description = "Scientific prototype for stochastic smoothing with alpha trimming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cvxpy>=1.5",
    "numpy>=2.0",
    "pot>=0.9.5",
    "torch>=2.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.10.8",
    "pyvista>=0.47.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
